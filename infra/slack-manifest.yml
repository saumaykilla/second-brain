display_information:
  name: ProjectBrain
  description: Remembers dead ends and warns before the team repeats them.
features:
  bot_user:
    display_name: ProjectBrain
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - chat:write
      - groups:history
settings:
  event_subscriptions:
    request_url: https://YOUR-DEPLOYMENT/api/slack/events
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://YOUR-DEPLOYMENT/api/slack/actions
  org_deploy_enabled: false
  socket_mode_enabled: false
